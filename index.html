<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18202C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock">
<title>Stock y ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--surface2:#F3F5F8;--ink:#141B26;--muted:#5E6A79;--line:#DDE3EA;
  --hero:#18202C;--hero-ink:#F4F6F9;--hero-muted:#9BA7B6;--hero-field:#242E3C;--hero-line:#2E3949;
  --amber:#F2A516;--amber-deep:#C98300;--amber-ink:#2A1B00;--amber-soft:#FFF3D9;
  --red:#D2463D;--red-soft:#FCE7E5;--green:#1E8A5A;--green-soft:#E1F3EA;--off:#DCE2E9;
  --r-lg:18px;--r:14px;--r-sm:10px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1117;--surface:#151C25;--surface2:#1C2530;--ink:#E8EDF2;--muted:#94A1B0;--line:#27323F;
    --hero:#18212D;--hero-ink:#F4F6F9;--hero-muted:#9BA7B6;--hero-field:#222D3B;--hero-line:#2E3A4A;
    --amber:#F5B12E;--amber-deep:#F5B12E;--amber-ink:#241700;--amber-soft:#3A2C0C;
    --red:#EE6C63;--red-soft:#3B1D1C;--green:#4DBE8C;--green-soft:#15352A;--off:#2A3542;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1117;--surface:#151C25;--surface2:#1C2530;--ink:#E8EDF2;--muted:#94A1B0;--line:#27323F;
  --hero:#18212D;--hero-ink:#F4F6F9;--hero-muted:#9BA7B6;--hero-field:#222D3B;--hero-line:#2E3A4A;
  --amber:#F5B12E;--amber-deep:#F5B12E;--amber-ink:#241700;--amber-soft:#3A2C0C;
  --red:#EE6C63;--red-soft:#3B1D1C;--green:#4DBE8C;--green-soft:#15352A;--off:#2A3542;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num,.big,.disp{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
img{max-width:100%}
[hidden]{display:none !important}

/* encabezado de secciones internas */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.top h1{margin:0;flex:1;font:700 30px/1.05 "Barlow Condensed","Arial Narrow",sans-serif}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:4px 16px 24px}
main.home{padding-top:0}
h2{font:600 22px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
p{margin:0 0 8px}
.sub{color:var(--muted);font-size:14px}
.grow{flex:1;min-width:0}
.name{font-weight:600;line-height:1.25}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sec{margin-top:24px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.count{background:var(--ink);color:var(--bg);font:700 14px/1 Barlow;padding:4px 8px;border-radius:999px}
.count.warn{background:var(--red);color:#fff}

/* inicio: panel superior */
.hero{background:var(--hero);color:var(--hero-ink);margin:0 -16px;padding:16px 16px 20px;border-radius:0 0 var(--r-lg) var(--r-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:26px solid rgba(242,165,22,.09);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;position:relative;z-index:1}
.hero-biz{font:700 28px/1.05 "Barlow Condensed","Arial Narrow",sans-serif}
.hero-date{color:var(--hero-muted);font-size:14px;margin-top:3px}
.hero .icon-btn{background:var(--hero-field);border-color:var(--hero-line);color:var(--hero-ink)}
.hsearch{position:relative;z-index:1;display:flex;align-items:center;gap:8px;background:var(--hero-field);border:1px solid var(--hero-line);border-radius:var(--r);padding:4px 4px 4px 14px}
.hsearch:focus-within{border-color:var(--amber)}
.hsearch svg{flex:none;color:var(--hero-muted)}
.hsearch input{background:transparent;border:0;color:var(--hero-ink);font-size:18px;padding:12px 4px;outline:none}
.hsearch input::placeholder{color:var(--hero-muted)}
.hsearch .scanbtn{flex:none;background:var(--amber);color:var(--amber-ink);border:0;border-radius:11px;width:48px;height:48px;display:grid;place-items:center;cursor:pointer}
.hint{position:relative;z-index:1;color:var(--hero-muted);font-size:13px;margin-top:8px}

.results{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.res{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.res .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.res .price{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;line-height:1.1}
.res .sellmini{flex:none;background:var(--amber);color:var(--amber-ink);border:0;border-radius:var(--r-sm);font-weight:700;padding:10px 12px;cursor:pointer}
.res .sellmini:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);min-height:112px}
.act .aic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface2)}
.act b{display:block;font:700 22px/1 "Barlow Condensed",sans-serif}
.act small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.act.sell{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.act.sell .aic{background:rgba(42,27,0,.12)}
.act.sell small{color:var(--amber-ink);opacity:.75}

.today{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.today div{padding:12px 10px;text-align:center}
.today div+div{border-left:1px solid var(--line)}
.today b{display:block;font:700 32px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.today span{font-size:13px;color:var(--muted)}
.feed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:10px;padding:0 14px}
.feed .fl{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.feed .fl:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.in{background:var(--amber-deep)}

.numbers-link{display:flex;align-items:center;gap:12px;width:100%;margin-top:24px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer}
.numbers-link .aic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);flex:none}

/* tarjetas y listas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;font-size:14px;color:var(--muted)}
.kpi b{display:block;font:600 27px/1.1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.main{grid-column:1/-1;background:var(--hero);color:var(--hero-ink);border-color:var(--hero)}
.kpi.main span{color:var(--hero-muted)}
.kpi.main b{font-size:38px;color:var(--amber)}
.stockline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.stockline:first-child{border-top:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.meter{display:flex;gap:2px;height:8px;width:100%;max-width:160px;margin-top:6px}
.meter i{flex:1;background:var(--off);border-radius:2px}
.meter.ok i.on{background:var(--green)}
.meter.low i.on{background:var(--amber)}
.meter.out i{background:var(--red-soft)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:7px;white-space:nowrap}
.tag.out{background:var(--red-soft);color:var(--red)}
.tag.low{background:var(--amber-soft);color:var(--ink)}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.void{background:var(--surface2);color:var(--muted)}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%;cursor:pointer}
.row .right{text-align:right;flex:none}
.row .right b{font:700 26px/1 "Barlow Condensed",sans-serif;display:block}
.mini{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.mini:first-child{border-top:0}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--hero);flex:none;display:grid;place-items:center;color:var(--amber)}
.photo{width:100%;max-height:300px;object-fit:contain;background:var(--surface2);border-radius:var(--r);margin-bottom:12px}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;padding:12px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--red)}
.btn.dangerfill{background:var(--red);border-color:var(--red);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:9px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-size:14px;font-weight:600;color:var(--muted)}
input,select,textarea{font:400 16px Barlow,system-ui,sans-serif;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 25%,transparent)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px}
.profit{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:12px;margin:10px 0;overflow:hidden}
.profit div{padding:10px 8px;text-align:center}
.profit div+div{border-left:1px solid var(--line)}
.profit span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.profit b{display:block;font:700 21px/1.15 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.profit .gain b{color:var(--green)}
.profit .gain.neg b{color:var(--red)}
.pctchip{background:var(--green-soft);color:var(--green);font-weight:700;font-size:13px;padding:2px 8px;border-radius:7px}
.lgain{font-size:14px;color:var(--muted);margin-top:6px}
.lgain b{color:var(--green)}
.lgain.neg b{color:var(--red)}
.total .tl2{display:flex;justify-content:space-between;font-size:15px;margin-top:6px;color:var(--hero-muted)}
.total .tl2 b{color:var(--hero-ink);font-family:"Barlow Condensed",sans-serif;font-size:19px}
.total .tl2.gain b{color:var(--amber)}
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar .btn{flex:none;padding:0 14px}
.check{display:flex;gap:10px;align-items:center;margin:4px 0 14px;font-weight:500}
.check input{width:22px;height:22px;flex:none;accent-color:var(--amber-deep)}
.margin{font-size:14px;font-weight:600;color:var(--green);margin-top:-4px;margin-bottom:10px;min-height:20px}
.margin.neg{color:var(--red)}

.vrow{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--surface)}
.vhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.vcard{border-top:1px solid var(--line);padding:14px 0}
.vcard:first-child{border-top:0;padding-top:0}
.vprice{font:700 30px/1 "Barlow Condensed",sans-serif;margin:8px 0 4px}
.vcost{font-size:14px;color:var(--muted);margin-bottom:8px}

.cline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.cl-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.step button{width:44px;border:0;background:var(--surface2);font-size:22px;cursor:pointer}
.step input{border:0;border-radius:0;text-align:center;padding:10px 4px;font-family:"Barlow Condensed",sans-serif;font-size:20px;box-shadow:none}
.cl-sub{display:flex;justify-content:space-between;margin-top:8px;font-size:15px}
.warn{color:var(--red);font-size:14px;font-weight:600;margin-top:6px}
.total{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.total .tl{display:flex;justify-content:space-between;align-items:baseline}
.total .big{font-size:36px;font-weight:700;color:var(--amber)}

.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.group.void{opacity:.55}
.g-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.g-line{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:2px 0}
.g-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.kind{font-weight:700;display:inline-flex;align-items:center;gap:6px}
.hist{font-size:14px}
.hist .g-line{border-top:1px solid var(--line);padding:8px 0}
.hist .g-line:first-child{border-top:0}
.strike{text-decoration:line-through}

.empty{text-align:center;padding:36px 8px}
.empty .btn{margin-top:10px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;color:var(--muted);font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]:not(.sell)::before{content:"";position:absolute;top:-7px;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--amber)}
.tab .ic{height:28px;display:grid;place-items:center}
.tab.sell .ic{background:var(--amber);color:var(--amber-ink);border-radius:16px;width:58px;height:44px;margin-top:-18px;border:4px solid var(--bg)}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-head>div{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.sheet-head h2{flex:1}
.sheet-body{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,12,18,.6);display:grid;place-items:center;padding:16px}
.dlg-box{background:var(--surface);border-radius:var(--r-lg);padding:20px;max-width:380px;width:100%}
.dlg-box p{font-size:17px;margin-bottom:16px}
.scan-box{background:var(--surface);border-radius:var(--r-lg);padding:14px;max-width:460px;width:100%}
.scan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:120px}
#reader video{width:100% !important;height:auto !important}
.scan-manual{display:flex;gap:8px;margin-top:10px}
.scan-manual .btn{flex:none}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--hero);color:var(--hero-ink);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;max-width:calc(100% - 32px);text-align:center;border-left:4px solid var(--amber)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}.kpi.main{grid-column:span 2}.hero{margin:0;border-radius:var(--r-lg);margin-top:12px}}
.auth{position:fixed;inset:0;z-index:60;background:var(--hero);color:var(--hero-ink);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center}
.auth-box{width:100%;max-width:380px}
.auth-logo{width:64px;height:64px;border-radius:18px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;margin-bottom:18px}
.auth h1{font:700 34px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 4px}
.auth .sub{color:var(--hero-muted);margin-bottom:20px}
.auth .field label{color:var(--hero-muted)}
.auth input{background:var(--hero-field);border-color:var(--hero-line);color:var(--hero-ink)}
.amsg{min-height:22px;font-size:14px;font-weight:600;color:#FF9A92;margin-bottom:8px}
.amsg.ok{color:#7FE0B0}
.auth .link{background:none;border:0;color:var(--hero-muted);text-decoration:underline;font-size:15px;margin-top:14px;cursor:pointer;padding:6px 0}
.auth .uid{background:var(--hero-field);border:1px solid var(--hero-line);border-radius:12px;padding:12px;font-family:monospace;font-size:13px;word-break:break-all;margin:8px 0 14px}
.boot{position:fixed;inset:0;z-index:55;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px}
.boot .spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--amber);animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.netpill{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:35;background:var(--hero);color:var(--hero-ink);border-left:4px solid var(--amber);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;max-width:calc(100% - 24px);text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.dev{margin-top:14px}
@media (prefers-reduced-motion:reduce){.boot .spin{animation:none}}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}

<script>
(function(){
'use strict';
var NDAYS=90;

var DAY=86400000;
var fmt=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/\./g,'').replace(',','.'));return isFinite(n)?n:0}
function pnum(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0}
function roundPrice(n){return n>=1000?Math.round(n/100)*100:Math.round(n/10)*10}
function pctFrom(c,p){return c>0?Math.round((p/c-1)*1000)/10:0}
function fp(n){return Number(n).toLocaleString('es-AR',{maximumFractionDigits:1})}
function int(v){var n=parseInt(String(v==null?'':v),10);return isFinite(n)?n:0}
function sum(a){return a.reduce(function(x,y){return x+y},0)}

var ICON_CAM='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>';
var ICON_IMG='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>';

var ICON_IN='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7.5 9.5 12 14l4.5-4.5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>';
var ICON_CHART='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/></svg>';
var ICON_STORE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l1.5-4h13L20 8M4 8v11a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8M4 8h16M9 12a3 3 0 0 0 6 0"/></svg>';
var ICON_CHEV='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>';

/* ---------- datos ---------- */
function blank(){return{negocio:'Mi negocio',margen:60,cats:CATS.slice(),products:[],movs:[],cat:[],pub:null}}

var S=blank();
var view='inicio',period='30',homeQuery='',prodQuery='',prodCat='',movFilter='todos';
var cart={venta:[],ingreso:[]},cartNote={venta:'',ingreso:''},cartQuery={venta:'',ingreso:''},updateCost=true,recalcPrice=false;
var draft=null,newCatOpen=false;
var catLoaded=false,catFilter='todas',catDraft=null,catCfg=null,catSug=[];
var user=null,unsubs=[],flags={p:false,m:false,c:false},booted=false,pending=false,fotoCache={},sheetPid=null,cfgTimer=null,dirty=false,DEV=/[?&]dev\b/.test(location.search);

function items(all){var out=[];S.products.forEach(function(p){if(!all&&p.archivado)return;p.variantes.forEach(function(v){out.push({p:p,v:v,key:p.id+'|'+v.id,label:p.nombre+(v.nombre?' — '+v.nombre:'')})})});return out}

function findItem(key){var k=String(key).split('|');var p=S.products.find(function(x){return x.id===k[0]});if(!p)return null;var v=p.variantes.find(function(x){return x.id===k[1]});if(!v)return null;return{p:p,v:v,key:key,label:p.nombre+(v.nombre?' — '+v.nombre:'')}}
function lastSale(key){var t=0;S.movs.forEach(function(m){if(m.tipo==='venta'&&!m.anulada&&m.pid+'|'+m.vid===key&&m.fecha>t)t=m.fecha});return t}
function periodStart(){var now=new Date();if(period==='hoy')return startToday();if(period==='mes')return new Date(now.getFullYear(),now.getMonth(),1).getTime();if(period==='todo')return 0;return Date.now()-parseInt(period,10)*DAY}
function matches(it,q){if(!q)return true;var hay=[it.p.nombre,it.p.marca,it.p.categoria,it.v.nombre,it.v.codigo].join(' ').toLowerCase();return q.toLowerCase().split(/\s+/).filter(Boolean).every(function(t){return hay.indexOf(t)>-1})}

function meterHTML(stock,min){var full=Math.max((min||0)*3,10);var on=stock<=0?0:Math.max(1,Math.min(10,Math.ceil(stock/full*10)));var st=stock<=0?'out':stock<=min?'low':'ok';var h='';for(var i=0;i<10;i++)h+='<i class="'+(i<on?'on':'')+'"></i>';return '<span class="meter '+st+'" role="img" aria-label="'+stock+' en stock">'+h+'</span>'}
function stockTag(stock,min){return stock<=0?'<span class="tag out">Sin stock</span>':stock<=min?'<span class="tag low">Quedan '+stock+'</span>':'<span class="tag ok">'+stock+' en stock</span>'}
function thumb(p){return p.thumb?'<img class="thumb" src="'+esc(p.thumb)+'" alt="">':'<span class="thumb">'+ICON_SPK+'</span>'}

function marginHTML(costo,precio){if(!precio)return '';var g=precio-costo;var pct=costo>0?Math.round(g/costo*100):null;return 'Ganás '+money(g)+(pct!==null?' ('+pct+'% sobre el costo)':'')}

/* ---------- utilidades de UI ---------- */
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2600)}
var dlgCb=null,dlgNeed=null;
function ask(msg,ok,cb,danger,need){dlgCb=cb;dlgNeed=need||null;var d=$('#dlg');d.innerHTML='<div class="dlg-box" role="dialog" aria-modal="true"><p>'+esc(msg)+'</p>'+(need?'<div class="field"><input id="askTxt" placeholder="Escribí '+esc(need)+'" oninput="A.askTxt(this.value)" autocomplete="off"></div>':'')+'<div class="btns"><button class="btn" onclick="A.dlg(false)">Cancelar</button><button class="btn '+(danger?'dangerfill':'primary')+'" id="askOk" onclick="A.dlg(true)"'+(need?' disabled':'')+'>'+esc(ok)+'</button></div></div>';d.hidden=false}
function askTxt(v){var b=$('#askOk');if(b)b.disabled=(String(v).trim().toUpperCase()!==dlgNeed)}

function dlg(yes){if(yes&&dlgNeed){var t=($('#askTxt')||{}).value||'';if(String(t).trim().toUpperCase()!==dlgNeed)return}$('#dlg').hidden=true;var cb=dlgCb;dlgCb=null;dlgNeed=null;if(yes&&cb)cb()}

function openSheet(title,body,pid){var s=$('#sheet');sheetPid=pid||null;s.innerHTML='<div class="sheet-head"><div><button class="icon-btn" onclick="A.closeSheet()" aria-label="Cerrar">'+ICON_BACK+'</button><h2>'+esc(title)+'</h2></div></div><div class="sheet-body">'+body+'</div>';if(s.hidden){s.hidden=false;s.scrollTop=0}document.body.style.overflow='hidden'}

function closeSheet(){var s=$('#sheet');s.hidden=true;s.innerHTML='';document.body.style.overflow='';draft=null;catDraft=null;sheetPid=null}

/* ---------- navegación ---------- */
var TITLES={inicio:'',productos:'Productos',venta:'Nueva venta',ingreso:'Ingreso de mercadería',movs:'Movimientos',numeros:'Números',catalogo:'Catálogo'};
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
  var top=$('#top');
  if(view==='inicio'){top.hidden=true;top.innerHTML=''}
  else{top.hidden=false;top.innerHTML=(view==='numeros'||view==='catalogo'?'<button class="icon-btn" onclick="A.go(\'inicio\')" aria-label="Volver">'+ICON_BACK+'</button>':'')+'<h1>'+TITLES[view]+'</h1><button class="icon-btn" onclick="A.settings()" aria-label="Ajustes">'+ICON_GEAR+'</button>'}
  document.querySelectorAll('.tab').forEach(function(b){if(b.getAttribute('data-v')===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  var el=$('#view');el.className=view==='inicio'?'home':'';
  if(view==='inicio'){el.innerHTML=renderInicio();renderHomeResults()}
  else if(view==='numeros')el.innerHTML=renderNumeros();
  else if(view==='catalogo')el.innerHTML=renderCatalogo();
  else if(view==='productos'){el.innerHTML=renderProductos();renderProdList()}
  else if(view==='venta'||view==='ingreso'){el.innerHTML=renderCart(view);renderResults();updateTotals()}
  else el.innerHTML=renderMovs();
}
function emptyState(){return '<div class="empty"><h2>Cargá tu primer producto</h2><p class="sub" style="margin-top:6px">Con los productos cargados vas a ver qué tenés, qué falta y qué se vende.</p><button class="btn primary block" onclick="A.newProduct()">Nuevo producto</button></div>'}

/* ---------- inicio ---------- */
function catCard(){return '<button class="numbers-link" style="margin-top:14px" onclick="A.go(\'catalogo\')"><span class="aic">'+ICON_STORE+'</span><span class="grow"><span class="name" style="display:block">Catálogo online</span><span class="sub">Tu link para mostrar productos y trabajos</span></span>'+ICON_CHEV+'</button>'}
function renderInicio(){
  var h='<section class="hero"><div class="hero-top"><div><div class="hero-biz">'+esc(S.negocio||'Mi negocio')+'</div><div class="hero-date">'+longDate()+'</div></div><button class="icon-btn" onclick="A.settings()" aria-label="Ajustes">'+ICON_GEAR+'</button></div>'+
    '<div class="hsearch">'+ICON_SEARCH+'<input id="hq" type="search" placeholder="¿Qué producto buscás?" value="'+esc(homeQuery)+'" oninput="A.hq(this.value)" aria-label="Buscar producto" autocomplete="off"><button class="scanbtn" onclick="A.scan(\'home\')" aria-label="Escanear código">'+ICON_SCAN+'</button></div>'+
    '<div class="hint">Buscá por nombre, marca, medida o código para ver stock y precio.</div></section>';
  h+='<div id="hres"></div>';
  if(!S.products.length)return h+emptyState()+catCard();
  h+='<div class="actions"><button class="act sell" onclick="A.go(\'venta\')"><span class="aic">'+ICON_PLUS+'</span><span><b>Vender</b><small>Registrar una venta</small></span></button><button class="act" onclick="A.go(\'ingreso\')"><span class="aic">'+ICON_IN+'</span><span><b>Ingreso</b><small>Cargar mercadería</small></span></button></div>';
  var its=items();
  var reponer=its.filter(function(i){return i.v.stock<=i.v.min}).sort(function(a,b){return a.v.stock-b.v.stock});
  var outN=reponer.filter(function(i){return i.v.stock<=0}).length;
  h+='<section class="sec"><div class="sec-head"><h2>Para reponer</h2>'+(reponer.length?'<span class="count'+(outN?' warn':'')+'">'+reponer.length+'</span>':'')+'</div>';
  if(!reponer.length)h+='<div class="card sub">Todo tiene stock por encima del mínimo.</div>';
  else{h+='<div class="card" style="padding:4px 14px">'+reponer.slice(0,6).map(function(i){return '<button class="mini" onclick="A.detail(\''+i.p.id+'\')"><span class="grow"><span class="name clip">'+esc(i.label)+'</span>'+meterHTML(i.v.stock,i.v.min)+'</span>'+stockTag(i.v.stock,i.v.min)+'</button>'}).join('')+'</div>';
    if(reponer.length>6)h+='<p class="sub" style="margin-top:8px">Y '+(reponer.length-6)+' más. Los ves en Productos.</p>'}
  h+='</section>';
  var t0=startToday();
  var vh=S.movs.filter(function(m){return m.tipo==='venta'&&!m.anulada&&m.fecha>=t0});
  var ih=S.movs.filter(function(m){return m.tipo==='ingreso'&&!m.anulada&&m.fecha>=t0});
  h+='<section class="sec"><div class="sec-head"><h2>Hoy</h2></div><div class="today"><div><b>'+new Set(vh.map(function(m){return m.grupo})).size+'</b><span>ventas</span></div><div><b>'+sum(vh.map(function(m){return m.cant}))+'</b><span>unidades vendidas</span></div><div><b>'+new Set(ih.map(function(m){return m.grupo})).size+'</b><span>ingresos</span></div></div>';
  var recent=S.movs.filter(function(m){return !m.anulada&&m.nota!=='Stock inicial'}).sort(function(a,b){return b.fecha-a.fecha}).slice(0,5);
  if(recent.length)h+='<div class="feed">'+recent.map(function(m){var it=findItem(m.pid+'|'+m.vid);var isV=m.tipo==='venta';return '<div class="fl"><span class="dot'+(isV?'':' in')+'"></span><span class="grow"><span class="clip">'+(isV?'':'Ingreso: ')+m.cant+' × '+esc(it?it.label:(m.label||'Producto eliminado'))+'</span></span><span class="sub">'+when(m.fecha)+'</span></div>'}).join('')+'</div>';
  h+='</section>';
  h+='<button class="numbers-link" onclick="A.go(\'numeros\')"><span class="aic">'+ICON_CHART+'</span><span class="grow"><span class="name" style="display:block">Números del negocio</span><span class="sub">Vendido, ganancia y más vendidos</span></span>'+ICON_CHEV+'</button>';
  h+=catCard();
  return h;
}
function renderHomeResults(){var el=$('#hres');if(!el)return;if(!homeQuery.trim()){el.innerHTML='';return}
  var r=items().filter(function(it){return matches(it,homeQuery)}).slice(0,10);
  if(!r.length){el.innerHTML='<div class="results"><div class="card sub">No hay productos que coincidan con "'+esc(homeQuery)+'".</div></div>';return}
  el.innerHTML='<div class="results">'+r.map(function(it){return '<div class="res"><button class="open" onclick="A.detail(\''+it.p.id+'\')">'+thumb(it.p)+'<span class="grow"><span class="name clip">'+esc(it.label)+'</span><span class="price">'+money(it.v.precio)+'</span> '+stockTag(it.v.stock,it.v.min)+'</span></button><button class="sellmini" onclick="A.quick(\''+it.key+'\',\'venta\')"'+(it.v.stock<=0?' disabled':'')+'>Vender</button></div>'}).join('')+'</div>'}

/* ---------- números ---------- */
function renderNumeros(){
  if(!S.products.length)return emptyState();
  var t=periodStart();
  var ms=S.movs.filter(function(m){return m.tipo==='venta'&&!m.anulada&&m.fecha>=t});
  var total=sum(ms.map(function(m){return m.precio*m.cant})),gan=sum(ms.map(function(m){return (m.precio-m.costo)*m.cant})),uds=sum(ms.map(function(m){return m.cant})),nv=new Set(ms.map(function(m){return m.grupo})).size;
  var its=items();
  var stockU=sum(its.map(function(i){return Math.max(0,i.v.stock)})),stockCosto=sum(its.map(function(i){return Math.max(0,i.v.stock)*i.v.costo})),stockPrecio=sum(its.map(function(i){return Math.max(0,i.v.stock)*i.v.precio}));
  var by={};ms.forEach(function(m){var k=m.pid+'|'+m.vid;by[k]=(by[k]||0)+m.cant});

function photo(inp){var f=inp.files&&inp.files[0];if(!f||!draft)return;var url=URL.createObjectURL(f);var img=new Image();
  img.onload=function(){function mk(max,q){var w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*r));h=Math.max(1,Math.round(h*r));var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',q)}
    draft.full=mk(480,0.72);draft.thumb=mk(160,0.65);draft.fotoChanged=true;URL.revokeObjectURL(url);renderForm()};
  img.onerror=function(){URL.revokeObjectURL(url);toast('No se pudo leer la imagen. Probá con otra.')};img.src=url}

  if(k==='costo'||k==='pct'){var c=num(v.costo),pc=pnum(v.pct);if(c>0&&String(v.pct).trim()!==''){v.precio=String(roundPrice(c*(1+pc/100)));var pr=$('#pr'+i);if(pr)pr.value=v.precio}}
  if(k==='precio'){var c2=num(v.costo);if(c2>0){v.pct=String(pctFrom(c2,num(v.precio)));var pe=$('#pc'+i);if(pe)pe.value=v.pct}}
  if(k==='costo'||k==='pct'||k==='precio'){var el=$('#mg'+i);if(el){el.textContent=marginHTML(num(v.costo),num(v.precio));el.className='margin'+(num(v.precio)-num(v.costo)<0?' neg':'')}}}
function toggleVar(on){var d=draft;if(on){d.hasVar=true}else{var extra=d.variantes.slice(1);if(extra.some(function(v){return !v.isNew})){toast('Primero quitá las otras variantes.');renderForm();return}d.variantes=[d.variantes[0]];d.variantes[0].nombre='';d.hasVar=false}renderForm()}
function rmVar(i){var v=draft.variantes[i];var go2=function(){draft.variantes.splice(i,1);renderForm()};

function varDoc(v,i,isNew){var o={nombre:String(v.nombre).trim(),codigo:String(v.codigo).trim(),costo:num(v.costo),precio:num(v.precio),min:Math.max(0,int(v.min)),orden:i};o.pct=o.costo>0?pctFrom(o.costo,o.precio):pnum(v.pct);if(isNew)o.stock=Math.max(0,int(v.stock));return o}
function saveProduct(){
  var d=draft;if(!d)return;
  if(!d.nombre.trim())return toast('Poné un nombre al producto.');
  if(d.hasVar&&d.variantes.some(function(v){return !String(v.nombre).trim()}))return toast('Cada variante necesita un nombre, por ejemplo "6x9" o "Negro".');
  if(d.variantes.some(function(v){return num(v.precio)<=0}))return toast('Falta el precio de venta.');
  var codes={};for(var i=0;i<d.variantes.length;i++){var c=String(d.variantes[i].codigo).trim();if(!c)continue;if(codes[c])return toast('El código '+c+' está repetido.');codes[c]=1;
    var vid=d.variantes[i].id;var clash=items(true).find(function(it){return it.v.codigo===c&&it.v.id!==vid});if(clash)return toast('El código '+c+' ya lo usa '+clash.label+(clash.p.archivado?' (archivado)':'')+'.')}
  if(!d.hasVar)d.variantes[0].nombre='';
  var old=d.id?S.products.find(function(x){return x.id===d.id}):null;
  if(d.id&&!old)return toast('Este producto ya no existe.');
  var pid=d.id||uid(),now=Date.now(),g=uid(),b=FB.batch();
  var base={nombre:d.nombre.trim(),marca:d.marca.trim(),categoria:d.categoria,descripcion:d.descripcion.trim(),thumb:d.thumb||null,tieneFoto:!!d.thumb};
  if(!old){
    var vmap={};d.variantes.forEach(function(v,i){vmap[v.id]=varDoc(v,i,true)});
    base.creado=now;base.archivado=false;base.variantes=vmap;b.set('productos',pid,base);
  }else{
    var up=base,keep={};
    d.variantes.forEach(function(v,i){keep[v.id]=1;var vd=varDoc(v,i,v.isNew);
      if(v.isNew)up['variantes.'+v.id]=vd;
      else ['nombre','codigo','costo','precio','pct','min','orden'].forEach(function(k){up['variantes.'+v.id+'.'+k]=vd[k]})});
    old.variantes.forEach(function(v){if(!keep[v.id])up['variantes.'+v.id]=FB.delField()});
    b.update('productos',pid,up);
  }
  d.variantes.forEach(function(v){if(!v.isNew)return;var st=Math.max(0,int(v.stock));if(st>0){var mid=uid();b.set('movimientos',mid,{id:mid,grupo:g,tipo:'ingreso',fecha:now,pid:pid,vid:v.id,cant:st,costo:num(v.costo),precio:num(v.precio),nota:'Stock inicial',label:d.nombre.trim()+(d.hasVar&&v.nombre?' — '+String(v.nombre).trim():''),usuario:uemail(),anulada:false})}});
  if(d.fotoChanged){delete fotoCache[pid];if(d.full)b.set('fotos',pid,{data:d.full});else b.del('fotos',pid)}
  b.commit().catch(writeErr);
  closeSheet();toast('Producto guardado');render();
}

function archive(pid,flag){var p=S.products.find(function(x){return x.id===pid});if(!p)return;
  var go2=function(){FB.batch().update('productos',pid,{archivado:!!flag}).commit().catch(writeErr);if(!flag&&!S.products.some(function(x){return x.id!==pid&&x.archivado}))prodCat='';closeSheet();toast(flag?'Producto archivado':'Producto reactivado');render()};
  if(flag)ask('¿Archivar '+p.nombre+'? Deja de aparecer en búsquedas y en «Para reponer», pero conserva su ficha y sus ventas. Lo podés reactivar cuando quieras.','Archivar',go2);else go2()}
function delProduct(pid){var p=S.products.find(function(x){return x.id===pid});if(!p)return;
  ask('¿Eliminar '+p.nombre+'? Sus ventas anteriores se conservan en Movimientos.','Eliminar',function(){var b=FB.batch();b.del('productos',pid);b.del('fotos',pid);b.commit().catch(writeErr);delete fotoCache[pid];closeSheet();toast('Producto eliminado');render()},true)}

/* ---------- venta e ingreso ---------- */
function renderCart(mode){

function catLink(){try{return new URL('tienda.html',location.href).href}catch(e){return 'tienda.html'}}

function readImage(file,max,q){return new Promise(function(res,rej){var url=URL.createObjectURL(file),img=new Image();img.onload=function(){var w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*r));h=Math.max(1,Math.round(h*r));var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}
function thumbFrom(dataUrl){return new Promise(function(res){var img=new Image();img.onload=function(){var max=320,w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*r));h=Math.max(1,Math.round(h*r));var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.62))};img.onerror=function(){res(null)};img.src=dataUrl})}
function buildShards(list){
  var its=list.filter(function(f){return f.visible}).sort(function(a,b){return b.orden-a.orden}).map(function(f){return{id:f.id,t:f.tipo,n:f.titulo,c:f.categoria||'',p:f.precio==null?null:f.precio,q:!!f.consultar,i:f.thumb||null}});
  var shards=[],cur=[],size=0;
  its.forEach(function(it){var sz=JSON.stringify(it).length;if(cur.length&&size+sz>700000){shards.push(cur);cur=[];size=0}cur.push(it);size+=sz});
  if(cur.length||!shards.length)shards.push(cur);
  return shards;
}
function publishShards(list,extra){
  var shards=buildShards(list),old=(S.pub&&S.pub.shards)||0;
  shards.forEach(function(items,i){FB.batch().set('catalogo_publico','s'+(i+1),{items:items}).commit().catch(writeErr)});
  if(old>shards.length){var bd=FB.batch();for(var i=shards.length;i<old;i++)bd.del('catalogo_publico','s'+(i+1));bd.commit().catch(writeErr)}
  var cfg=Object.assign({},pubDefaults(),S.pub||{},extra||{});cfg.shards=shards.length;cfg.v=Date.now();
  S.pub=cfg;
  FB.batch().set('catalogo_publico','config',cfg,true).commit().catch(writeErr);
}
