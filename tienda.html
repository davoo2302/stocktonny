<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Catálogo de productos y trabajos">
<meta property="og:title" content="Catálogo">
<meta property="og:description" content="Mirá los productos y trabajos y pedí por WhatsApp.">
<title>Catálogo</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--soft:#F3F4F6;--line:#E5E7EB;--ink:#111827;--muted:#6B7280;--body:#374151;
  --accent:#F2A516;--accent-ink:#2A1B00;--wa:#16A34A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* barra de vista previa (solo cuando se abre desde la app) */
.backbar{background:var(--ink);color:#fff;padding:9px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.backbar a{color:#fff;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:3px 2px}
.backbar span{color:#9CA3AF;text-align:right}

/* encabezado */
.top-in{display:flex;align-items:center;gap:14px;padding:20px 0 16px}
.logo{width:48px;height:48px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:21px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.who h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.who p{margin:3px 0 0;color:var(--muted);font-size:14px}
.tools{padding-bottom:12px}
.search{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:0 14px}
.search:focus-within{background:#fff;border-color:var(--ink)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:16px;padding:13px 0}
.search input::placeholder{color:#9CA3AF}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-top:10px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,24,39,.12)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:11px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* productos */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px;padding:20px 0 28px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 20px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.card .img{aspect-ratio:1;background:var(--soft);border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center;color:#9CA3AF}
.card .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
@media (hover:hover){.card:hover .img img{transform:scale(1.04)}}
.card .badge{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.95);color:var(--ink);font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}
.card .b{padding:11px 2px 0}
.card .cat{font-size:12px;color:var(--muted);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .n{font-weight:500;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .p{font-weight:700;font-size:16px;margin-top:6px;font-variant-numeric:tabular-nums}
.card .p.q{font-weight:500;color:var(--muted);font-size:14px}
.msg{text-align:center;color:var(--muted);padding:56px 12px}
.msg b{display:block;color:var(--ink);font-size:18px;font-weight:600;margin-bottom:4px}
.skel{aspect-ratio:1/1.35;border-radius:14px;background:linear-gradient(100deg,var(--soft) 30%,#fff 50%,var(--soft) 70%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.offline{background:var(--soft);border-radius:12px;padding:9px 14px;font-size:14px;color:var(--muted);margin:12px 0 0}
.foot{border-top:1px solid var(--line);padding:28px 0 130px;text-align:center;color:var(--muted);font-size:14px}
.foot b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:2px}

/* botones */
.btn{appearance:none;border:1px solid var(--line);background:#fff;font-weight:600;font-size:16px;padding:14px 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.grow{flex:1}
.btn.sm{padding:10px 14px;font-size:15px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}

/* barra del pedido */
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;max-width:560px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(17,24,39,.32)}
.cartbar .t{flex:1;min-width:0;font-weight:600}
.cartbar .t small{display:block;color:#9CA3AF;font-weight:400}
.cartbar .btn.primary{padding:11px 16px}

/* hojas (detalle y pedido) */
.sheet{position:fixed;inset:0;z-index:50;background:#fff;overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sh-head{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.sh-head>div{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.sh-head h2{margin:0;flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{width:100%;max-width:720px;margin:0 auto;padding:16px 16px 28px;flex:1}
.gal{position:relative;background:var(--soft);border-radius:18px;overflow:hidden;aspect-ratio:1;max-height:70vh;display:grid;place-items:center;color:#9CA3AF;touch-action:pan-y}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.gn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 2px 8px rgba(17,24,39,.2);display:grid;place-items:center;cursor:pointer}
.gn.l{left:10px}.gn.r{right:10px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;width:60px;height:60px;border-radius:11px;border:2px solid transparent;padding:0;overflow:hidden;background:var(--soft);cursor:pointer;opacity:.65}
.thumbs button.on{border-color:var(--ink);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.d-cat{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:20px}
.d-title{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:4px 0 8px}
.d-price{font-size:26px;font-weight:700;margin:6px 0 16px;font-variant-numeric:tabular-nums}
.d-price.q{font-size:17px;font-weight:500;color:var(--muted)}
.d-desc{white-space:pre-line;color:var(--body);margin:0 0 6px}
.h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 4px}
.specs{margin:0}
.specs div{display:flex;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.specs div:last-child{border-bottom:1px solid var(--line)}
.specs dt{flex:0 0 40%;color:var(--muted);font-size:15px}
.specs dd{margin:0;font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere}
.actions{position:sticky;bottom:0;z-index:3;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.actions>div{max-width:720px;margin:0 auto;display:flex;gap:8px}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line img,.line .ph{width:56px;height:56px;border-radius:11px;object-fit:cover;background:var(--soft);flex:none}
.line .i{flex:1;min-width:0}
.line .i b{display:block;line-height:1.25;font-weight:500}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:11px;overflow:hidden;flex:none}
.step button{width:36px;border:0;background:#fff;font-size:20px;cursor:pointer}
.step span{min-width:32px;display:grid;place-items:center;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 6px;font-size:16px}
.total b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:500;font-size:15px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:70;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="backbar" id="backbar" hidden><a href="./?ir=catalogo">← Volver a la app</a><span>Así lo ven tus clientes</span></div>
<header><div class="wrap"><div class="top-in"><div class="logo" id="logo">C</div><div class="who"><h1 id="brand">Catálogo</h1><p id="tagline"></p></div></div></div></header>

<div class="wrap tools" id="tools" hidden>
  <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar productos" autocomplete="off" aria-label="Buscar"></label>
  <div class="tabs" id="tabs" role="group" aria-label="Tipo" hidden></div>
</div>
<div class="bar" id="bar" hidden><div class="wrap"><div class="chips" id="chips" role="group" aria-label="Categorías"></div></div></div>

<main class="wrap">
  <div id="offline" class="offline" hidden>Sin conexión: se muestra la última versión guardada.</div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<footer class="foot" id="foot" hidden><div class="wrap"><b id="footname"></b>¿Tenés alguna duda?<br><button class="btn wa" id="footbtn" style="margin-top:14px">Escribinos por WhatsApp</button></div></footer>

<div class="cartbar" id="cartbar" hidden>
  <div class="t"><span id="cbn"></span><small id="cbs"></small></div>
  <button class="btn primary sm" id="cbopen">Ver pedido</button>
</div>

<div class="sheet" id="detail" role="dialog" aria-modal="true" aria-label="Detalle" hidden></div>
<div class="sheet" id="cartsheet" role="dialog" aria-modal="true" aria-label="Mi pedido" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
const CONFIG={
  apiKey:"AIzaSyA9GhUn903Hd96Ota8EEFHkYymHU2ozJAg",
  authDomain:"stock-tonny.firebaseapp.com",
  projectId:"stock-tonny",
  storageBucket:"stock-tonny.firebasestorage.app",
  messagingSenderId:"419324355925",
  appId:"1:419324355925:web:c4a38caff22b7072a0fbdc"
};
const V='12.18.0',B='https://www.gstatic.com/firebasejs/'+V+'/';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const money=n=>fmt.format(Math.round(n||0));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const isImg=s=>typeof s==='string'&&s.indexOf('data:image/')===0;
const IC={
  cam:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>',
  x:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  share:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
  l:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  r:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  wa:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg>'
};

let cfg={},items=[],tab='producto',cat='',q='',wa='',db=null,fs=null,layer=null,curId=null,pendingP=null,loaded=false;
let cart={};try{cart=JSON.parse(localStorage.getItem('tienda_cart_v1')||'{}')||{}}catch(e){}
const detailCache=new Map();
let readyRes;const ready=new Promise(r=>{readyRes=r});

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
function saveCart(){try{localStorage.setItem('tienda_cart_v1',JSON.stringify(cart))}catch(e){}}

/* ---------- aspecto según la configuración ---------- */
function applyCfg(){
  const c=/^#[0-9a-f]{6}$/i.test(cfg.color||'')?cfg.color:'#F2A516';
  const r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);
  const s=document.documentElement.style;
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  s.setProperty('--accent',c);s.setProperty('--accent-ink',lum>0.6?'#1A1300':'#FFFFFF');s.setProperty('--accent-hi',lum<0.35?'#F4F6F9':c);
  const name=(cfg.negocio||'Catálogo');
  $('brand').textContent=name;document.title=name;
  $('tagline').textContent=cfg.texto||'';$('tagline').hidden=!cfg.texto;
  const lg=$('logo');
  if(isImg(cfg.logo)){lg.innerHTML='<img alt="" src="'+esc(cfg.logo)+'">'}else{lg.textContent=(name.trim().charAt(0)||'C').toUpperCase()}
  wa=String(cfg.whatsapp||'').replace(/\D/g,'');
}

/* ---------- carga de datos (pocas lecturas) ---------- */
async function load(){
  let cached=null;
  try{cached=JSON.parse(localStorage.getItem('tienda_v1')||'null')}catch(e){}
  if(cached&&cached.cfg){cfg=cached.cfg;items=cached.items||[];loaded=true;applyCfg();render();checkPending()}
  else $('grid').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try{
    const appM=await import(B+'firebase-app.js'),fsM=await import(B+'firebase-firestore.js');
    const app=appM.initializeApp(CONFIG);
    db=fsM.getFirestore(app);fs={doc:fsM.doc,getDoc:fsM.getDoc};readyRes();
    const s=await fs.getDoc(fs.doc(db,'catalogo_publico','config'));
    $('offline').hidden=true;
    if(!s.exists()){if(!cached){loaded=true;items=[];render();checkPending()}return}
    const c=s.data();
    if(cached&&cached.cfg&&cached.cfg.v===c.v)return;
    const n=Math.max(1,Math.min(60,parseInt(c.shards,10)||1));
    const parts=await Promise.all(Array.from({length:n},(_,i)=>fs.getDoc(fs.doc(db,'catalogo_publico','s'+(i+1)))));
    items=parts.flatMap(p=>p.exists()?(p.data().items||[]):[]);
    cfg=c;loaded=true;
    try{localStorage.setItem('tienda_v1',JSON.stringify({cfg:c,items:items}))}catch(e){}
    applyCfg();render();checkPending();
  }catch(e){
    console.error(e);
    if(cached)$('offline').hidden=false;
    else{loaded=true;$('grid').innerHTML='<div class="msg" style="grid-column:1/-1"><b>No se pudo cargar el catálogo</b>Revisá tu conexión y volvé a abrir el link.</div>'}
  }
}

/* ---------- lista ---------- */
function render(){
  const hasP=items.some(x=>x.t!=='trabajo'),hasT=items.some(x=>x.t==='trabajo');
  if(!hasP&&hasT)tab='trabajo';if(!hasT)tab='producto';
  $('tools').hidden=!items.length;
  const tabs=$('tabs');tabs.hidden=!(hasP&&hasT);
  if(!tabs.hidden)tabs.innerHTML='<button aria-pressed="'+(tab==='producto')+'" data-tab="producto">Productos</button><button aria-pressed="'+(tab==='trabajo')+'" data-tab="trabajo">Trabajos</button>';
  const cur=items.filter(x=>(x.t==='trabajo')===(tab==='trabajo'));
  const cats=[...new Set(cur.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  if(cat&&cats.indexOf(cat)<0)cat='';
  $('bar').hidden=!cats.length;
  $('chips').innerHTML=cats.length?'<button class="chip" aria-pressed="'+(!cat)+'" data-cat="">Todo</button>'+cats.map(c=>'<button class="chip" aria-pressed="'+(cat===c)+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join(''):'';
  $('q').placeholder=tab==='trabajo'?'Buscar trabajos':'Buscar productos';
  $('foot').hidden=!(items.length&&wa);
  $('footname').textContent=cfg.negocio||'Catálogo';
  renderGrid(cur);renderCartBar();
}
function renderGrid(cur){
  cur=cur||items.filter(x=>(x.t==='trabajo')===(tab==='trabajo'));
  const terms=norm(q).split(/\s+/).filter(Boolean);
  const list=cur.filter(x=>(!cat||x.c===cat)&&terms.every(t=>norm(x.n+' '+x.c).indexOf(t)>-1));
  const g=$('grid');
  if(!items.length){g.innerHTML='<div class="msg" style="grid-column:1/-1"><b>Estamos armando el catálogo</b>Volvé pronto para ver los productos.</div>';return}
  if(!list.length){g.innerHTML='<div class="msg" style="grid-column:1/-1"><b>No encontramos nada</b>Probá con otra palabra o categoría.</div>';return}
  g.innerHTML=list.map(x=>{
    const price=x.t==='trabajo'?'':(x.p!=null&&!x.q?'<div class="p">'+money(x.p)+'</div>':'<div class="p q">Consultar</div>');
    return '<button class="card" data-id="'+esc(x.id)+'"><div class="img">'+(isImg(x.i)?'<img loading="lazy" alt="'+esc(x.n)+'" src="'+esc(x.i)+'">':IC.cam)+(x.t==='trabajo'?'<span class="badge">Trabajo</span>':'')+'</div><div class="b">'+(x.c?'<div class="cat">'+esc(x.c)+'</div>':'')+'<div class="n">'+esc(x.n)+'</div>'+price+'</div></button>'}).join('');
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;cat='';render()});
$('chips').addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(!b)return;cat=b.dataset.cat;render()});
$('q').addEventListener('input',e=>{q=e.target.value;renderGrid()});
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openDetail(c.dataset.id)});

/* ---------- capas (el botón "atrás" cierra la hoja) ---------- */
function pushLayer(n){layer=n;history.pushState({l:n},'')}
function hideSheets(){$('detail').hidden=true;$('cartsheet').hidden=true;document.body.style.overflow='';curId=null}
function closeLayer(){if(!layer)return;hideSheets();layer=null;renderCartBar();history.back()}
window.addEventListener('popstate',()=>{if(layer){hideSheets();layer=null;renderCartBar()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer)closeLayer()});

/* ---------- detalle ---------- */
async function getDetail(id){
  if(detailCache.has(id))return detailCache.get(id);
  await ready;
  const s=await fs.getDoc(fs.doc(db,'catalogo_detalle',id));
  const d=s.exists()?s.data():null;if(d)detailCache.set(id,d);return d;
}
function priceHTML(t,p,qq){if(t==='trabajo')return '';return (p!=null&&!qq)?'<div class="d-price">'+money(p)+'</div>':'<div class="d-price q">Precio a consultar</div>'}
async function openDetail(id){
  const it=items.find(x=>x.id===id);if(!it)return;
  curId=id;
  const el=$('detail');
  el.innerHTML=shell(it,null,true);el.hidden=false;el.scrollTop=0;document.body.style.overflow='hidden';
  if(!layer)pushLayer('detail');else layer='detail';
  let d=null;
  try{d=await getDetail(id)}catch(e){console.error(e)}
  if(curId!==id)return;
  el.innerHTML=shell(it,d,false);
  gal.i=0;
}
const gal={i:0,fotos:[]};
function shell(it,d,loading){
  const fotos=(d&&Array.isArray(d.fotos)?d.fotos:[]).filter(isImg);
  gal.fotos=fotos.length?fotos:(isImg(it.i)?[it.i]:[]);
  const t=it.t==='trabajo';
  const specs=(d&&Array.isArray(d.specs)?d.specs:[]).filter(s=>s&&s.k&&s.v);
  let h='<div class="sh-head"><div><button class="icon" data-act="close" aria-label="Volver al catálogo">'+IC.l+'</button><h2>'+esc(it.n)+'</h2><button class="icon" data-act="share" aria-label="Compartir">'+IC.share+'</button></div></div><div class="sh-body">';
  h+='<div class="gal" id="gal">'+(gal.fotos.length?'<img alt="'+esc(it.n)+'" id="galimg" src="'+esc(gal.fotos[0])+'">':IC.cam)+(gal.fotos.length>1?'<button class="gn l" data-act="prev" aria-label="Foto anterior">'+IC.l+'</button><button class="gn r" data-act="next" aria-label="Foto siguiente">'+IC.r+'</button>':'')+'</div>';
  if(gal.fotos.length>1)h+='<div class="thumbs" id="thumbs">'+gal.fotos.map((f,i)=>'<button class="'+(i===0?'on':'')+'" data-act="pick" data-i="'+i+'" aria-label="Ver foto '+(i+1)+'"><img alt="" src="'+esc(f)+'"></button>').join('')+'</div>';
  h+=(it.c?'<div class="d-cat">'+esc(it.c)+'</div>':'')+'<div class="d-title">'+esc(it.n)+'</div>'+priceHTML(it.t,d?d.precio:it.p,d?d.consultar:it.q);
  if(loading)h+='<p class="note">Cargando detalle…</p>';
  else if(!d)h+='<p class="note">No se pudo cargar el detalle. Revisá tu conexión.</p>';
  else{
    if(d.descripcion)h+='<div class="d-desc">'+esc(d.descripcion)+'</div>';
    if(specs.length)h+='<div class="h3">Características</div><dl class="specs">'+specs.map(s=>'<div><dt>'+esc(s.k)+'</dt><dd>'+esc(s.v)+'</dd></div>').join('')+'</dl>';
  }
  h+='</div><div class="actions"><div>';
  if(!wa)h+='<span class="note" style="flex:1;align-self:center">Este catálogo todavía no tiene WhatsApp para pedidos.</span>';
  else if(t)h+='<button class="btn wa grow" data-act="ask">'+IC.wa+' Quiero algo así</button>';
  else h+='<button class="btn primary grow" data-act="add">Agregar al pedido</button><button class="btn out" data-act="ask" aria-label="Consultar por WhatsApp">'+IC.wa+'</button>';
  h+='</div></div>';
  return h;
}
function showPhoto(){
  const im=$('galimg');if(!im||!gal.fotos.length)return;
  gal.i=(gal.i+gal.fotos.length)%gal.fotos.length;im.src=gal.fotos[gal.i];
  document.querySelectorAll('#thumbs button').forEach((d,i)=>d.classList.toggle('on',i===gal.i));
}
$('detail').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,it=items.find(x=>x.id===curId);
  if(a==='close')closeLayer();
  else if(a==='prev'){gal.i--;showPhoto()}
  else if(a==='next'){gal.i++;showPhoto()}
  else if(a==='pick'){gal.i=+b.dataset.i;showPhoto()}
  else if(a==='add'&&it){cart[it.id]=Math.min(99,(cart[it.id]||0)+1);saveCart();renderCartBar();toast('Agregado al pedido ('+cart[it.id]+')')}
  else if(a==='ask'&&it)askOne(it);
  else if(a==='share'&&it)share(it);
});
let tx=null;
$('detail').addEventListener('touchstart',e=>{tx=e.target.closest('#gal')?e.touches[0].clientX:null},{passive:true});
$('detail').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>45&&gal.fotos.length>1){gal.i+=dx<0?1:-1;showPhoto()}});
function pageUrl(id){const u=new URL(location.href);u.search='';u.hash='';if(id)u.searchParams.set('p',id);return u.toString()}
function openWa(text){window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(text),'_blank','noopener')}
function askOne(it){
  const t=it.t==='trabajo'
    ?'Hola! Vi el trabajo *'+it.n+'* en tu catálogo y quiero algo parecido.\n'+pageUrl(it.id)
    :'Hola! Me interesa *'+it.n+'*'+((it.p!=null&&!it.q)?' ('+money(it.p)+')':'')+'. ¿Está disponible?\n'+pageUrl(it.id);
  openWa(t);
}
async function share(it){
  const url=pageUrl(it.id);
  try{if(navigator.share){await navigator.share({title:it.n,text:it.n,url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Link copiado')}catch(e){toast('No se pudo copiar el link')}
}

/* ---------- pedido ---------- */
function cartLines(){
  const out=[];Object.keys(cart).forEach(id=>{const it=items.find(x=>x.id===id&&x.t!=='trabajo');if(it&&cart[id]>0)out.push({it,qty:cart[id]})});return out;
}
function renderCartBar(){
  const ls=cartLines();
  // limpiar productos que ya no están
  Object.keys(cart).forEach(id=>{if(loaded&&!items.some(x=>x.id===id))delete cart[id]});
  const n=ls.reduce((s,l)=>s+l.qty,0);
  $('cartbar').hidden=!n||layer==='detail'||layer==='cart';
  $('cbn').textContent='Mi pedido · '+n+(n===1?' producto':' productos');
  const priced=ls.filter(l=>l.it.p!=null&&!l.it.q).reduce((s,l)=>s+l.it.p*l.qty,0);
  $('cbs').textContent=priced?'Total estimado '+money(priced):'A cotizar por WhatsApp';
}
function openCart(){
  const el=$('cartsheet');drawCart();el.hidden=false;el.scrollTop=0;document.body.style.overflow='hidden';
  if(!layer)pushLayer('cart');else layer='cart';renderCartBar();
}
function drawCart(){
  const ls=cartLines(),el=$('cartsheet');
  let h='<div class="sh-head"><div><button class="icon" data-act="close" aria-label="Cerrar">'+IC.x+'</button><h2>Mi pedido</h2></div></div><div class="sh-body">';
  if(!ls.length)h+='<div class="msg"><b>Tu pedido está vacío</b>Agregá productos desde el catálogo.</div>';
  ls.forEach(l=>{
    const it=l.it;
    h+='<div class="line">'+(isImg(it.i)?'<img alt="" src="'+esc(it.i)+'">':'<span class="ph"></span>')+'<div class="i"><b>'+esc(it.n)+'</b><span class="note">'+((it.p!=null&&!it.q)?money(it.p):'Consultar')+'</span></div><div class="step"><button data-act="minus" data-id="'+esc(it.id)+'" aria-label="Menos">−</button><span>'+l.qty+'</span><button data-act="plus" data-id="'+esc(it.id)+'" aria-label="Más">+</button></div></div>'});
  if(ls.length){
    const priced=ls.filter(l=>l.it.p!=null&&!l.it.q),tot=priced.reduce((s,l)=>s+l.it.p*l.qty,0),open=ls.length-priced.length;
    h+='<div class="total"><span>Total estimado</span><b>'+money(tot)+'</b></div>';
    if(open)h+='<p class="note">'+open+(open===1?' producto se cotiza':' productos se cotizan')+' por WhatsApp y no está'+(open===1?'':'n')+' en el total.</p>';
    h+='<p class="note">El pedido no se paga acá: se envía por WhatsApp y ahí se confirma la disponibilidad, el precio final y la entrega.</p>';
  }
  h+='</div><div class="actions"><div>'+(ls.length?(wa?'<button class="btn wa grow" data-act="send">'+IC.wa+' Enviar pedido por WhatsApp</button><button class="btn" data-act="clear">Vaciar</button>':'<span class="note">Este catálogo todavía no tiene WhatsApp para pedidos.</span>'):'<button class="btn grow" data-act="close">Volver al catálogo</button>')+'</div></div>';
  el.innerHTML=h;
}
$('cbopen').addEventListener('click',openCart);
$('cartsheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='close')closeLayer();
  else if(a==='plus'){cart[id]=Math.min(99,(cart[id]||0)+1);saveCart();drawCart()}
  else if(a==='minus'){cart[id]=(cart[id]||0)-1;if(cart[id]<=0)delete cart[id];saveCart();drawCart()}
  else if(a==='clear'){cart={};saveCart();drawCart()}
  else if(a==='send')sendCart();
});
function sendCart(){
  const ls=cartLines();if(!ls.length||!wa)return;
  const priced=ls.filter(l=>l.it.p!=null&&!l.it.q),tot=priced.reduce((s,l)=>s+l.it.p*l.qty,0);
  let t='Hola! Quiero consultar por este pedido:\n\n'+ls.map(l=>'• '+l.qty+' × '+l.it.n+' — '+((l.it.p!=null&&!l.it.q)?money(l.it.p)+' c/u':'Consultar')).join('\n');
  if(priced.length)t+='\n\nTotal estimado: '+money(tot)+(priced.length<ls.length?' (más lo que está a consultar)':'');
  t+='\n\nCatálogo: '+pageUrl();
  openWa(t);
}

$('footbtn').addEventListener('click',()=>{if(wa)openWa('Hola! Vi tu catálogo y quiero hacer una consulta.\n'+pageUrl())});

/* ---------- link directo a un producto (?p=id) ---------- */
function checkPending(){
  if(pendingP&&items.some(x=>x.id===pendingP)){const id=pendingP;pendingP=null;history.replaceState(null,'',pageUrl());openDetail(id)}
}
try{const sp=new URL(location.href).searchParams;if(sp.get('vista')==='app')$('backbar').hidden=false;const p=sp.get('p');if(p)pendingP=p}catch(e){}
load();
</script>
</body>
